channels:
  - astra-toolbox
  - conda-forge
  - nvidia
dependencies:
  - astra-toolbox>=2.3.1  # official `astra-toolbox` channel doesn't ship any `aarch64` build
    # and `conda-forge` only ships astra-toolbox up to 2.3.1
  - cuda-version=12.9  # conda-forge's CUDA builds of pytorch: 12.9 has torch 2.13, 12.8 only 2.7
  - pip<=25.2  # pip 25.3 drops support for setup.py install which is used to install tomosipo and ts_algorithms from source
  - python=3.12
  # torch from conda too, so every compiled library uses conda's C++ runtime. A pip
  # torch loads the system's, and conda's scipy etc. then fail on machines with an
  # older system runtime ("CXXABI_1.3.15 not found").
  - pytorch-gpu
  # LION does not import torchvision, but mrpro, piq and spyrit (pip, pyproject.toml)
  # require it: from conda here, or pip would install it with a pip torch
  - torchvision
  - deepinv  # example scripts
  - kornia
  - torchdiffeq
  - torchmetrics  # example scripts
  - h5py
  - imageio
  - matplotlib
  - numpy<2.5  # numpy 2.5 (and above) breaks spgl1 0.0.3 (currently latest version)
  - opencv
  - pandas
  - patchelf
  - pillow
  - pydicom
  - pyside6
  - pywavelets
  - pyyaml
  - natsort
  - scikit-image
  - scipy
  - spgl1
  - statsmodels
  - tifffile
  - typing_extensions>=4.16
